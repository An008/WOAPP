<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#070F1C">
<title>IRON PROTOCOL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:#070F1C;}
body{font-family:-apple-system,system-ui,'Segoe UI',sans-serif;color:#C0D4EC;font-size:16px;line-height:1.5;overscroll-behavior:none;}
:root{
  --bg:#070F1C;--bg2:#0C1929;--bg3:#112035;--bg4:#172840;
  --card:#0D1E32;--border:#1B3050;--bord2:#263E5A;
  --txt:#C0D4EC;--txt2:#6A8AAA;--txt3:#3A5570;--white:#EBF4FF;
  --amber:#E8A02A;--green:#3DB87A;--red:#E35050;--blue:#4A9EDB;--purple:#9B8DE8;
  --nav-h:68px;
}
/* -- LOGIN -- */
#login-screen{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;}
.ls-logo{font-size:60px;margin-bottom:10px;line-height:1;}
.ls-title{font-size:22px;font-weight:900;color:var(--white);letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px;}
.ls-sub{font-size:13px;color:var(--txt2);margin-bottom:40px;}
.ls-form{width:100%;max-width:340px;}
.ls-label{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--txt2);margin-bottom:6px;display:block;}
input.ls-inp{width:100%;background:var(--bg3);border:1.5px solid var(--bord2);border-radius:10px;color:var(--white);font-size:18px;padding:13px 16px;margin-bottom:16px;-webkit-appearance:none;}
input.ls-inp:focus{outline:none;border-color:var(--amber);}
.ls-btn{width:100%;padding:15px;border-radius:12px;background:var(--amber);border:none;font-size:17px;font-weight:900;color:#000;cursor:pointer;letter-spacing:.04em;margin-top:4px;}
.ls-btn:active{opacity:.8;}
.ls-err{font-size:13px;color:var(--red);text-align:center;margin-top:10px;min-height:20px;}
.ls-note{font-size:12px;color:var(--txt3);text-align:center;margin-top:20px;line-height:1.6;}
/* -- APP -- */
#app{height:100%;display:flex;flex-direction:column;overflow:hidden;display:none;}
#scroller{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;}
#scroller::-webkit-scrollbar{display:none;}
.view{display:none;min-height:calc(100dvh - var(--nav-h));padding-bottom:calc(var(--nav-h)+20px);}
.view.on{display:block;}
.overlay{position:fixed;inset:0;z-index:200;display:none;flex-direction:column;background:var(--bg);transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);}
.overlay.on{display:flex;transform:translateX(0);}
/* -- NAV -- */
#nav{height:var(--nav-h);background:var(--bg2);border-top:1px solid var(--border);display:flex;align-items:flex-start;padding-top:8px;position:fixed;bottom:0;left:0;right:0;z-index:100;}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 0;opacity:.4;}
.nb.on{opacity:1;}
.nb i{font-size:22px;font-style:normal;}
.nb s{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;text-decoration:none;}
/* -- HEADER -- */
.hdr{height:56px;display:flex;align-items:center;padding:0 18px;background:var(--bg);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;flex-shrink:0;gap:6px;}
.hdr-ttl{font-size:17px;font-weight:700;color:var(--white);flex:1;}
.hdr-sub{font-size:11px;color:var(--txt2);margin-top:2px;}
.back{width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--txt2);font-size:22px;cursor:pointer;flex-shrink:0;}
/* -- ATOMS -- */
.sh{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--txt3);padding:18px 18px 8px;}
.btn{display:flex;align-items:center;justify-content:center;padding:14px;border-radius:12px;font-size:16px;font-weight:800;color:var(--white);cursor:pointer;border:none;width:100%;background:rgba(255,255,255,.12);}
.btn:active{opacity:.7;}
.btn-g{background:rgba(61,184,122,.18);border:1px solid rgba(61,184,122,.35);}
/* -- TODAY -- */
.hero{border-radius:18px;padding:20px 18px;margin:10px 18px 0;border:1px solid transparent;}
.hero-A{background:linear-gradient(135deg,rgba(232,160,42,.15),rgba(240,112,48,.05));border-color:rgba(232,160,42,.2);}
.hero-B{background:linear-gradient(135deg,rgba(74,158,219,.15),rgba(61,184,122,.05));border-color:rgba(74,158,219,.2);}
.hero-C{background:linear-gradient(135deg,rgba(227,80,80,.15),rgba(155,141,232,.05));border-color:rgba(227,80,80,.2);}
.hero-REST{background:var(--bg3);border-color:var(--border);}
.h-bar{flex:1;height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;}
.h-fill{height:100%;border-radius:3px;transition:width .4s;}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;}
.stat-v{font-size:30px;font-weight:900;color:var(--white);font-variant-numeric:tabular-nums;}
.stat-l{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--txt2);margin-top:2px;}
.lm{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer;}
.lm i{font-size:20px;flex-shrink:0;font-style:normal;}
.lm-c{font-size:22px;color:var(--bord2);}
.lm-c.yes{color:var(--green);}
/* -- SESSION OVERVIEW -- */
.blk-hdr{padding:12px 18px 5px;background:var(--bg);}
.blk-n{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;}
.ex-row{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--border);cursor:pointer;}
.ex-st{width:24px;height:24px;border-radius:50%;border:2px solid var(--bord2);display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;}
.ex-st.done{background:var(--green);border-color:var(--green);}
.ex-st.part{background:var(--amber);border-color:var(--amber);}
.ex-n{font-size:15px;font-weight:600;color:var(--white);flex:1;}
.ex-v{font-size:12px;color:var(--txt2);}
/* -- FLASH CARD -- */
.fc-top{padding:10px 18px;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0;}
.fc-pb{height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-bottom:5px;}
.fc-pf{height:100%;border-radius:2px;background:var(--green);transition:width .4s;}
.fc-body{flex:1;overflow-y:auto;padding:16px 18px 100px;}
.fc-blk{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;margin-bottom:5px;}
.fc-name{font-size:26px;font-weight:900;color:var(--white);line-height:1.2;margin-bottom:5px;}
.fc-set{font-size:15px;color:var(--txt2);margin-bottom:14px;}
.fc-cue{background:var(--bg3);border-left:3px solid var(--amber);border-radius:0 8px 8px 0;padding:11px 13px;font-size:13px;color:var(--txt);line-height:1.65;margin-bottom:12px;}
.fc-feel{background:rgba(61,184,122,.06);border-left:3px solid var(--green);border-radius:0 8px 8px 0;padding:10px 13px;font-size:12px;color:var(--txt2);line-height:1.6;margin-bottom:12px;}
.fc-feel strong{font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--green);display:block;margin-bottom:3px;}
.fc-yt{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:8px;background:rgba(255,40,40,.08);border:1px solid rgba(255,80,80,.2);font-size:12px;font-weight:700;color:#ff7070;text-decoration:none;margin-bottom:12px;}
.fc-inp-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px;margin-bottom:10px;}
.fc-ig{display:flex;flex-direction:column;gap:4px;flex:1;}
.fc-il{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--txt3);}
input.fc-if{background:var(--bg3);border:1.5px solid var(--bord2);border-radius:8px;color:var(--white);font-size:20px;font-weight:700;padding:10px 12px;width:100%;text-align:center;-webkit-appearance:none;}
input.fc-if:focus{outline:none;border-color:var(--amber);}
.rpe-g{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:10px;}
.rpe-b{height:34px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);font-size:12px;font-weight:700;color:var(--txt2);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.rpe-b.on{color:#000;}
.rpe-b[data-v="1"].on,.rpe-b[data-v="2"].on{background:var(--green);}
.rpe-b[data-v="3"].on,.rpe-b[data-v="4"].on{background:#8BC34A;}
.rpe-b[data-v="5"].on,.rpe-b[data-v="6"].on{background:var(--amber);}
.rpe-b[data-v="7"].on,.rpe-b[data-v="8"].on{background:#FF7043;}
.rpe-b[data-v="9"].on,.rpe-b[data-v="10"].on{background:var(--red);}
.fc-np{display:flex;gap:8px;margin-top:8px;}
.fc-np-item{flex:1;background:var(--bg3);border-radius:8px;padding:8px 10px;}
.fc-np-l{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--txt3);margin-bottom:2px;}
.fc-np-n{font-size:12px;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fc-msg{font-size:12px;font-style:italic;color:var(--txt3);text-align:center;padding:6px;}
.fc-done-wrap{position:fixed;bottom:0;left:0;right:0;padding:14px 18px;background:var(--bg);border-top:1px solid var(--border);z-index:50;}
.fc-done{width:100%;padding:16px;border-radius:14px;font-size:17px;font-weight:900;color:var(--white);cursor:pointer;border:none;background:var(--green);}
.fc-done:active{opacity:.75;}
/* -- REST -- */
#rest-screen{position:fixed;inset:0;z-index:500;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center;}
#rest-screen.show{display:flex;}
.rs-lbl{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--txt2);}
.rs-t{font-size:90px;font-weight:900;color:var(--white);font-variant-numeric:tabular-nums;line-height:1;}
.rs-ex{font-size:14px;color:var(--txt2);margin:8px 0 20px;}
.rs-bar{width:100%;max-width:260px;height:4px;background:var(--border);border-radius:2px;overflow:hidden;}
.rs-bf{height:100%;background:var(--green);transition:width 1s linear;}
.rs-skip{margin-top:24px;font-size:14px;font-weight:700;color:var(--txt3);cursor:pointer;padding:10px 24px;}
/* -- SESSION COMPLETE -- */
.sc-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 20px;text-align:center;}
/* -- MUSCLE MAP -- */
.mm-thumb{display:flex;align-items:center;gap:8px;margin-bottom:12px;cursor:pointer;opacity:.85;}
.mm-thumb:active{opacity:1;}
.mm-thumb-txt{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--txt2);line-height:1.5;}
/* -- JOURNAL -- */
.jq{margin-bottom:18px;}
.jq-l{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--txt3);margin-bottom:3px;display:block;}
.jq-q{font-size:13px;font-weight:700;color:var(--amber);margin-bottom:7px;display:block;}
textarea.jq-i{width:100%;background:var(--bg3);border:1.5px solid var(--bord2);border-radius:10px;color:var(--txt);font-size:15px;padding:12px;resize:none;height:76px;font-family:inherit;}
textarea.jq-i:focus{outline:none;border-color:var(--amber);}
/* -- HISTORY -- */
.hi{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--border);cursor:pointer;}
.hi-d{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.hi-dt{font-size:11px;font-weight:600;color:var(--txt2);width:76px;flex-shrink:0;}
/* -- SETTINGS -- */
.sr{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border);}
.sr-l{flex:1;font-size:15px;color:var(--white);}
input.sr-i{background:transparent;border:none;color:var(--amber);font-size:14px;text-align:right;width:160px;}
input.sr-i:focus{outline:none;}
/* -- BREATHING -- */
.br-ring{width:160px;height:160px;border-radius:50%;border:3px solid var(--bord2);display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:24px;transition:transform 3s ease-in-out,border-color .4s;}
.br-ring.inh{transform:scale(1.12);border-color:var(--blue);}
.br-ring.hld{transform:scale(1.12);border-color:var(--amber);}
.br-ring.exh{transform:scale(1);border-color:var(--green);}
/* -- ASSESS -- */
.pc-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden;}
.pc-fill{height:100%;background:var(--purple);border-radius:2px;}
/* -- EMPTY -- */
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center;gap:10px;color:var(--txt2);}
.empty i{font-size:48px;opacity:.3;font-style:normal;}
@media(max-width:340px){.fc-name{font-size:21px;}.rs-t{font-size:72px;}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="ls-logo">&#9889;</div>
  <div class="ls-title">IRON PROTOCOL</div>
  <div class="ls-sub">Sign in to continue</div>
  <div class="ls-form">
    <label class="ls-label">Name</label>
    <input class="ls-inp" type="text" id="ls-name" placeholder="NC" autocomplete="username">
    <label class="ls-label">Password</label>
    <input class="ls-inp" type="password" id="ls-pwd" placeholder="&#9679;&#9679;&#9679;&#9679;&#9679;" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="ls-btn" onclick="doLogin()">&#9654; Sign In</button>
    <div class="ls-err" id="ls-err"></div>
  </div>
  <div class="ls-note">Edit <strong>USERS</strong> in index.html to add or change passwords<br>Data syncs automatically via GitHub</div>
</div>

<!-- APP -->
<div id="app">
  <div id="scroller">
    <div id="v-today" class="view on"></div>
    <div id="v-history" class="view"></div>
    <div id="v-journal" class="view"></div>
    <div id="v-metrics" class="view"></div>
    <div id="v-settings" class="view"></div>
  </div>
  <nav id="nav">
    <div class="nb on" id="nb-today" onclick="showTab('today')"><i>&#127968;</i><s>Today</s></div>
    <div class="nb" id="nb-session" onclick="beginSession()"><i>&#9889;</i><s>Mission</s></div>
    <div class="nb" id="nb-history" onclick="showTab('history')"><i>&#128197;</i><s>History</s></div>
    <div class="nb" id="nb-journal" onclick="showTab('journal')"><i>&#128214;</i><s>Journal</s></div>
    <div class="nb" id="nb-metrics" onclick="showTab('metrics')"><i>&#9878;</i><s>Operator</s></div>
    <div class="nb" id="nb-settings" onclick="showTab('settings')"><i>&#9881;</i><s>Setup</s></div>
  </nav>
</div>

<!-- OVERLAYS -->
<div id="v-overview" class="overlay">
  <div class="hdr"><div class="back" onclick="closeOv('v-overview')">&#8249;</div><div><div class="hdr-ttl" id="ov-ttl"></div><div class="hdr-sub" id="ov-sub"></div></div></div>
  <div id="ov-body" style="overflow-y:auto;flex:1;padding-bottom:20px;"></div>
  <div style="padding:14px 18px;border-top:1px solid var(--border)"><button class="btn btn-g" onclick="startFC()">&#9654; Begin Session</button></div>
</div>
<div id="v-flashcard" class="overlay">
  <div class="hdr"><div class="back" onclick="confirmExit()">&#8249;</div><div class="hdr-ttl" id="fc-ttl">Session</div><div style="margin-left:auto;font-size:13px;font-weight:700;color:var(--amber)" id="fc-hdr-r"></div></div>
  <div style="flex:1;display:flex;flex-direction:column;overflow:hidden;">
    <div class="fc-top"><div class="fc-pb"><div class="fc-pf" id="fc-pf" style="width:0%"></div></div><div style="display:flex;justify-content:space-between"><span style="font-size:11px;font-weight:800;color:var(--green)" id="fc-pct">0%</span><span style="font-size:11px;color:var(--txt3)" id="fc-pos"></span></div></div>
    <div class="fc-body" id="fc-body"></div>
    <div class="fc-done-wrap"><button class="fc-done" id="fc-done-btn" onclick="fcDone()"></button></div>
  </div>
</div>
<div id="v-breathing" class="overlay">
  <div class="hdr"><div class="back" onclick="stopBreath();closeOv('v-breathing')">&#8249;</div><div class="hdr-ttl">Breathing</div></div>
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center;" id="br-body"></div>
</div>
<div id="v-assessment" class="overlay">
  <div class="hdr"><div class="back" onclick="closeOv('v-assessment')">&#8249;</div><div class="hdr-ttl">Assessment</div></div>
  <div id="as-body" style="overflow-y:auto;flex:1;padding-bottom:20px;"></div>
</div>

<!-- REST TIMER -->
<div id="rest-screen">
  <div class="rs-lbl">REST</div>
  <div class="rs-t" id="rs-t">60</div>
  <div class="rs-ex" id="rs-ex"></div>
  <div class="rs-bar"><div class="rs-bf" id="rs-bf" style="width:100%"></div></div>
  <div class="rs-skip" onclick="skipRest()">Skip</div>
</div>

<!-- Modules load in dependency order. app.js must remain last. -->
<!-- ?v= is a cache buster - bump it in every module tag when you deploy. -->
<script src="js/config.js?v=2.2.0"></script>
<script src="js/data-programme.js?v=2.2.0"></script>
<script src="js/state.js?v=2.2.0"></script>
<script src="js/auth.js?v=2.2.0"></script>
<script src="js/notifications.js?v=2.2.0"></script>
<script src="js/ai.js?v=2.2.0"></script>
<script src="js/plan.js?v=2.2.0"></script>
<script src="js/field.js?v=2.2.0"></script>
<script src="js/rpe.js?v=2.2.0"></script>
<script src="js/nutrition.js?v=2.2.0"></script>
<script src="js/progress.js?v=2.2.0"></script>
<script src="js/ui-today.js?v=2.2.0"></script>
<script src="js/ui-session.js?v=2.2.0"></script>
<script src="js/ui-assessment.js?v=2.2.0"></script>
<script src="js/ui-journal.js?v=2.2.0"></script>
<script src="js/recovery.js?v=2.2.0"></script>
<script src="js/ui-metrics.js?v=2.2.0"></script>
<script src="js/ui-settings.js?v=2.2.0"></script>
<script src="js/app.js?v=2.2.0"></script>
</body>
</html>
